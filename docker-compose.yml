services:
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: truthmyson/wordcounter-backend:latest
    container_name: wordcounter-backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: truthmyson/wordcounter-frontend:latest
    container_name: wordcounter-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
